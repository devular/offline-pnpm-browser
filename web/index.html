<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Package Explorer — offline-setup</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header>
      <h1>Package Explorer</h1>
      <div id="search-wrap">
        <input type="text" id="search" placeholder="Search 552 packages…" autofocus />
      </div>
    </header>

    <main>
      <section id="search-results" class="hidden"></section>
      <section id="category-detail" class="hidden">
        <button id="back-btn">&larr; All categories</button>
        <h2 id="detail-title"></h2>
        <div id="detail-packages"></div>
      </section>
      <section id="categories">
        <div id="category-grid"></div>
      </section>
    </main>

    <footer id="status-bar"></footer>

    <script type="module" src="./main.js"></script>
  </body>
</html>
